<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>sprouts</title>

  <link rel="icon" type="image/x-icon" href="assets/ui/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- AUDIO -->
  <audio id="bg-music" loop>
    <source src="assets/music.mp3" type="audio/mpeg">
  </audio>

  <div class="app-shell">

    <!-- =========================
         SETUP SCREEN
    ========================== -->
    <div id="setup-screen" class="screen active">

      <div class="card">

      <button id="settings-btn" class="settings-img-btn">
        <img src="assets/ui/settings-btn.png" alt="Settings">
      </button>

        <h1 class="title">✨ welcome to ✨</h1>
        <h1 class="app-title">sprouts</h1>

        <p class="subtitle">create your little pocket companion</p>

        <input id="pet-name" type="text" placeholder="Name your pet..." />

        <label class="label">Choose your Sprout</label>

        <div class="options" id="pet-options">

          <button class="option-btn pet-btn" data-pet="earth">
            <img src="assets/pets/happy-earth-sprout.png" class="sprout-preview">
          </button>

          <button class="option-btn pet-btn" data-pet="moon">
            <img src="assets/pets/happy-moon-sprout.png" class="sprout-preview">
          </button>

          <button class="option-btn pet-btn" data-pet="star">
            <img src="assets/pets/happy-star-sprout.png" class="sprout-preview">
          </button>

        </div>

        <label class="label">Choose a background</label>
        <div class="options" id="bg-options">

          <button class="option-btn theme-btn" data-background="forest">
            <img src="assets/backgrounds/forest-icon.png" class="bg-preview">
          </button>

          <button class="option-btn theme-btn" data-background="night">
            <img src="assets/backgrounds/night-icon.png" class="bg-preview">
          </button>

          <button class="option-btn theme-btn" data-background="cottage">
            <img src="assets/backgrounds/cottage-icon.png" class="bg-preview">
          </button>

        </div>

        <button id="start-btn" class="primary-btn" disabled>
          start
        </button>

      </div>
    </div>


    <!-- =========================
         GENERATION SCREEN
    ========================== -->
    <div id="gen-screen" class="screen">
      <div class="card gen-card">

        <h2>Growing your Sprout</h2>

        <div class="gen-scene">
          <img src="assets/pets/seedling.png" class="gen-sprout" />
          <div class="gen-glow"></div>
        </div>

        <p id="gen-text">Germinating...</p>

        <div class="loading-bar">
          <div id="loading-fill"></div>
        </div>

      </div>
    </div>

    <!-- =========================
         GAME SCREEN
    ========================== -->
    <div id="game-screen" class="screen hidden">

      <div class="game-card">

      <button id="settings-btn-game" class="settings-img-btn">
        <img src="assets/ui/settings-btn.png" alt="Settings">
      </button>

        <!-- PET SCENE (ONLY VISUAL WORLD) -->
        <div class="scene">

          <div id="background" class="background"></div>

          <div class="pet-area">
            <img id="pet-sprite" class="pet-sprite" src="" alt="pet sprite">
          </div>

        </div>

        <!-- HUD INFO (OUTSIDE SCENE) -->
        <div class="hud">

          <h2 id="pet-name-display"></h2>
          <div id="mood-text" class="mood"></div>

        </div>

        <!-- STATS -->
        <div class="stats">

          <div class="stat">
            🍗 Hunger
            <div class="bar"><div id="hunger-bar"></div></div>
          </div>

          <div class="stat">
            ❤️ Happy
            <div class="bar"><div id="happy-bar"></div></div>
          </div>

          <div class="stat">
            ⚡ Energy
            <div class="bar"><div id="energy-bar"></div></div>
          </div>

        </div>

        <!-- ACTIONS (future minigames) -->
        <div class="controls">

          <button class="retro-btn" id="feed-btn">Feed</button>
          <button class="retro-btn" id="play-btn">Play</button>
          <button class="retro-btn" id="rest-btn">Rest</button>

        </div>

      </div>
    </div>

  </div>

  <!-- =========================
       INTRO POPUP (GLOBAL)
  ========================== -->
  <div id="intro-popup" class="modal hidden">
    <div class="modal-card">

      <h2 id="intro-title"></h2>
      <p id="intro-text"></p>

      <button id="close-intro">Start caring for them</button>

    </div>
  </div>

  <!-- =========================
       SETTINGS MODAL (GLOBAL)
  ========================== -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-card">

      <h2>Settings</h2>

      <div class="setting-row">
        <span>Music</span>
        <label class="switch">
          <input type="checkbox" id="toggle-music-switch">
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-row">
        <span>High Contrast</span>
        <label class="switch">
          <input type="checkbox" id="toggle-contrast-switch">
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-row">
        <span>Reduce Motion</span>
        <label class="switch">
          <input type="checkbox" id="toggle-motion-switch">
          <span class="slider"></span>
        </label>
      </div>

      <hr>

      <button id="restart-game">Restart Game</button>
      <button id="close-settings">Close</button>

    </div>
  </div>

  <!-- =========================
     MINIGAME MODAL
  ========================= -->

  <div id="minigame-modal" class="modal hidden">

    <div class="modal-card">

      <h2 id="game-title"></h2>

      <div id="minigame-content">

      </div>

    </div>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
