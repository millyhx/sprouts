<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cosy Pet App</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- AUDIO -->
  <audio id="bg-music" loop>
    <source src="assets/music.mp3" type="audio/mpeg">
  </audio>

  <div class="app-shell">

    <!-- SETUP SCREEN -->
    <div id="setup-screen" class="screen active">

      <!-- settings button (top-right floating) -->
      <button id="settings-btn-setup" class="settings-btn">⚙️</button>

      <div class="card">

        <h1 class="title">✨ welcome to ✨</h1>

        <h1 class="app-title">sprouts</h1>

        <p class="subtitle">create your little pocket companion</p>

        <input id="pet-name" type="text" placeholder="Name your pet..." />

        <label class="label">Choose your Sprout</label>

        <div class="options" id="pet-options">
          <button class="option-btn sprout-card" data-pet="earth">
            <img src="assets/happy-earth-sprout.png" class="sprout-preview">
            <span>Earth Sprout</span>
          </button>

          <button class="option-btn sprout-card" data-pet="moon">
            <img src="assets/happy-moon-sprout.png" class="sprout-preview">
            <span>Moon Sprout</span>
          </button>

          <button class="option-btn sprout-card" data-pet="star">
            <img src="assets/happy-star-sprout.png" class="sprout-preview">
            <span>Star Sprout</span>
          </button>
        </div>

        <label class="label">Choose a background</label>

        <div class="options" id="bg-options">
          <button class="option-btn sprout-card" data-background="forest">
            <img src="assets/forest-icon.png" class="bg-preview">
            <span>Forest</span>
          </button>

          <button class="option-btn sprout-card" data-background="night">
            <img src="assets/night-icon.png" class="bg-preview">
            <span>Night</span>
          </button>

          <button class="option-btn sprout-card" data-background="cottage">
            <img src="assets/cottage-icon.png" class="bg-preview">
            <span>Cottage</span>
          </button>
        </div>

        <button id="start-btn" class="primary-btn" disabled>
          start
        </button>

      </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen hidden">

      <!-- settings button (game version) -->
      <button id="settings-btn-game" class="settings-btn">⚙️</button>

      <!-- intro popup -->
      <div id="intro-popup" class="modal hidden">
        <div class="modal-card">
          <h2 id="intro-title"></h2>
          <p id="intro-text"></p>
          <button id="close-intro">Start caring for them 💚</button>
        </div>
      </div>

      <div class="game-card">

        <div class="scene">
          <div id="background" class="background"></div>

          <div class="top-info">
            <h2 id="pet-name-display">Pet Name</h2>
          </div>

          <div class="pet-area">
            <div class="pet-sprite">
              <img id="pet-sprite-img" src="" alt="pet sprite">
            </div>
            <div id="mood-text" class="mood">...</div>
          </div>
        </div>

        <div class="stats">
          <div class="stat">🍗 Hunger <div class="bar"><div id="hunger-bar"></div></div></div>
          <div class="stat">❤️ Happy <div class="bar"><div id="happy-bar"></div></div></div>
          <div class="stat">⚡ Energy <div class="bar"><div id="energy-bar"></div></div></div>
        </div>

        <div class="controls">
          <button class="retro-btn" id="feed-btn">Feed</button>
          <button class="retro-btn" id="play-btn">Play</button>
          <button class="retro-btn" id="rest-btn">Rest</button>
        </div>

      </div>
    </div>

  </div>

  <!-- SETTINGS MODAL (GLOBAL) -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-card">

      <h2>Settings</h2>

      <button id="toggle-music">Mute Music</button>
      <button id="toggle-contrast">High Contrast</button>
      <button id="toggle-reduced-motion">Reduce Motion</button>

      <hr>

      <button id="restart-game">Restart Game</button>
      <button id="close-settings">Close</button>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
